<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>People Playground Mod Security Scanner</title>
  <style>
    :root {
      --bg: #121214;
      --card-bg: #1a1a1e;
      --border: #2e2e36;
      --text: #e1e1e6;
      --muted: #a8a8b3;
      --danger: #ff5555;
      --warning: #ffb86c;
      --success: #50fa7b;
      --accent: #bd93f9;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 900px;
    }
    h1 {
      margin-top: 0;
      font-size: 1.6rem;
      color: #fff;
    }
    p {
      color: var(--muted);
      line-height: 1.5;
    }
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 2.5rem;
      text-align: center;
      background: var(--card-bg);
      cursor: pointer;
      margin: 1.5rem 0;
      transition: border-color 0.2s;
    }
    .upload-zone:hover {
      border-color: var(--accent);
    }
    input[type="file"] {
      display: none;
    }
    .btn {
      background: var(--accent);
      color: #121214;
      padding: 0.6rem 1.2rem;
      font-weight: 600;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      display: inline-block;
      margin-top: 0.5rem;
    }
    .stats {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      flex: 1;
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      text-align: center;
    }
    .stat-number {
      font-size: 1.4rem;
      font-weight: 700;
      margin-top: 0.3rem;
    }
    .results {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: monospace;
      font-size: 0.95rem;
    }
    .badge {
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      font-family: sans-serif;
    }
    .badge-danger { background: rgba(255, 85, 85, 0.2); color: var(--danger); }
    .badge-warning { background: rgba(255, 184, 108, 0.2); color: var(--warning); }
    .badge-clean { background: rgba(80, 250, 123, 0.2); color: var(--success); }
    .issues-list {
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .issue-item {
      margin-bottom: 0.5rem;
    }
    .snippet {
      background: #0d0d0f;
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      font-family: monospace;
      color: #ffb86c;
      overflow-x: auto;
      margin-top: 0.2rem;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>FPS+++++ Detector</h1>
  <p>Select your <code>Mods</code> folder to parse all <code>.cs</code> files specifically for the FPS+++++ malware signatures.</p>

  <div class="upload-zone" onclick="document.getElementById('folderInput').click()">
    <p style="margin: 0;">Click here to scan your <strong>Mods</strong> folder</p>
    <button class="btn" type="button">Select Folder</button>
    <input type="file" id="folderInput" webkitdirectory directory multiple>
  </div>

  <div class="stats" id="statsBar" style="display: none;">
    <div class="stat-card">Scanned Files<div class="stat-number" id="scannedCount">0</div></div>
    <div class="stat-card">Flagged Threats<div class="stat-number" id="threatCount" style="color: var(--danger)">0</div></div>
    <div class="stat-card">Clean Files<div class="stat-number" id="cleanCount" style="color: var(--success)">0</div></div>
  </div>

  <div class="results" id="results"></div>
</div>

<script>
  const folderInput = document.getElementById('folderInput');
  const resultsDiv = document.getElementById('results');
  const statsBar = document.getElementById('statsBar');
  const scannedCount = document.getElementById('scannedCount');
  const threatCount = document.getElementById('threatCount');
  const cleanCount = document.getElementById('cleanCount');

  // Threat signature definitions specifically targeting the FPS+++++ malware
  const SIGNATURES = [
    {
      id: 'FPS_MALWARE_B64_PAYLOAD',
      severity: 'CRITICAL',
      desc: 'Massive unformatted Base64 string block (FPS+++++ payload signature)',
      regex: /[A-Za-z0-9+/=]{500,}/g
    },
    {
      id: 'EMBEDDED_PE',
      severity: 'CRITICAL',
      desc: 'Base64 DOS/PE header detected (disguised .dll or .exe file)',
      regex: /TVqQAAMAAAAEAAAA/g
    },
    {
      id: 'MALWARE_DECODE_TRIGGER',
      severity: 'HIGH',
      desc: 'Byte array decoded from Base64 string (often paired with payload)',
      regex: /Convert\s*\.\s*FromBase64String\s*\(/g
    },
    {
      id: 'MALWARE_SPECIFIC_CALL',
      severity: 'CRITICAL',
      desc: 'FPS+++++ specific execution method call ("jJ9aatj9")',
      regex: /jJ9aatj9/g
    }
  ];

  folderInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files).filter(file => file.name.endsWith('.cs'));
    
    resultsDiv.innerHTML = '';
    statsBar.style.display = 'flex';
    
    let scanned = 0;
    let threats = 0;
    let clean = 0;

    for (const file of files) {
      scanned++;
      const content = await file.text();
      const detectedIssues = [];

      for (const sig of SIGNATURES) {
        let match;
        // Reset regex state
        sig.regex.lastIndex = 0;
        
        while ((match = sig.regex.exec(content)) !== null) {
          const start = Math.max(0, match.index - 40);
          const end = Math.min(content.length, match.index + match[0].length + 40);
          const snippet = content.slice(start, end).replace(/\r?\n|\r/g, ' ');
          
          detectedIssues.push({
            severity: sig.severity,
            desc: sig.desc,
            snippet: snippet.length > 120 ? snippet.slice(0, 120) + '...' : snippet
          });
          
          // Break to avoid logging duplicate occurrences of the same signature in the same file
          break;
        }
      }

      const card = document.createElement('div');
      card.className = 'card';

      const relPath = file.webkitRelativePath || file.name;

      if (detectedIssues.length > 0) {
        threats++;
        const isCritical = detectedIssues.some(i => i.severity === 'CRITICAL');
        card.innerHTML = `
          <div class="card-header">
            <span>${relPath}</span>
            <span class="badge ${isCritical ? 'badge-danger' : 'badge-warning'}">
              ${isCritical ? 'Malicious Code' : 'Suspicious'}
            </span>
          </div>
          <div class="issues-list">
            ${detectedIssues.map(issue => `
              <div class="issue-item">
                <strong>[${issue.severity}]</strong>${issue.desc}
                <div class="snippet">${escapeHtml(issue.snippet)}</div>
              </div>
            `).join('')}
          </div>
        `;
      } else {
        clean++;
        card.innerHTML = `
          <div class="card-header">
            <span>${relPath}</span>
            <span class="badge badge-clean">Clean</span>
          </div>
        `;
      }

      resultsDiv.appendChild(card);
      scannedCount.textContent = scanned;
      threatCount.textContent = threats;
      cleanCount.textContent = clean;
    }
  });

  function escapeHtml(string) {
    return String(string)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>

</body>
</html>
